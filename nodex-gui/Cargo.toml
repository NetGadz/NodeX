[package]
name = "nodex-gui"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.28", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.28"
egui_extras = { version = "0.28", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
qrcode = "0.14"
rfd = "0.14"
nodex-messenger = { path = "../nodex-messenger" }
nodex-kademlia = { path = "../nodex-kademlia" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
getrandom = "0.2"
hex = "0.4"
rodio = { version = "0.19", default-features = false, features = ["wav", "vorbis"] }
cpal = "0.15"
sha2 = "0.10"
