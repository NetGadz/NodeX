[workspace]
members = [
    "nodex-types",
    "nodex-crypto",
    "nodex-storage",
    "nodex-state",
    "nodex-vm",
    "nodex-exec",
    "nodex-mempool",
    "nodex-consensus",
    "nodex-p2p",
    "nodex-p2p-net",
    "nodex-sync",
    "nodex-rpc",
    "nodex-sdk",
    "nodex-contracts",
    "nodex-blockchain",
    "nodex-wallet-gui",
]
resolver = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
