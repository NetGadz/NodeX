[package]
name = "nodex-rpc"
version = "0.1.0"
edition = "2021"

[dependencies]
nodex-types = { path = "../nodex-types" }
nodex-state = { path = "../nodex-state" }
nodex-mempool = { path = "../nodex-mempool" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
jsonrpsee = { version = "0.20", features = ["server", "macros"] }
