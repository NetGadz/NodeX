[package]
name = "nodex-wallet-gui"
version = "0.1.0"
edition = "2021"

[dependencies]
nodex-blockchain = { path = "../nodex-blockchain" }
nodex-storage = { path = "../nodex-storage" }
nodex-consensus = { path = "../nodex-consensus" }
nodex-p2p-net = { path = "../nodex-p2p-net" }
nodex-crypto = { path = "../nodex-crypto" }

eframe = "0.27"
egui = "0.27"
ed25519-dalek = { version = "2.1", features = ["serde", "rand_core"] }
rand = "0.8"
tokio = { version = "1.0", features = ["full"] }
hex = "0.4"
bip39 = "2.0"
