<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="100%" height="260">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0D13" />
      <stop offset="100%" stop-color="#131722" />
    </linearGradient>
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="850" height="260" rx="16" fill="url(#bg)" stroke="#1E293B" stroke-width="2"/>

  <!-- Grid Lines -->
  <line x1="50" y1="130" x2="800" y2="130" stroke="#1E293B" stroke-dasharray="4 4" stroke-width="1.5"/>

  <!-- Left Node (Sender Alice) -->
  <g transform="translate(100, 130)">
    <circle r="42" fill="#1E293B" stroke="#3B82F6" stroke-width="3" filter="url(#glow)"/>
    <circle r="34" fill="#0F172A"/>
    <text y="-5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#F8FAFC" text-anchor="middle">Alice</text>
    <text y="14" font-family="monospace" font-size="10" fill="#94A3B8" text-anchor="middle">[Node 0x8F2A]</text>
    <text y="58" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#38BDF8" text-anchor="middle">X25519 Ephemeral</text>
  </g>

  <!-- Animated Data Packet 1 (Direct UDP Fast-Path) -->
  <path d="M 150 110 Q 425 40 700 110" fill="none" stroke="url(#neonGreen)" stroke-width="3" stroke-dasharray="10 10">
    <animate attributeName="stroke-dashoffset" from="200" to="0" dur="2s" repeatCount="indefinite" />
  </path>
  <text x="425" y="60" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="bold" fill="#10B981" text-anchor="middle">
    ⚡ 1. Direct UDP Fast Path (0-RTT sub-30ms)
  </text>

  <!-- Middle Relay (Onion Node) -->
  <g transform="translate(425, 130)">
    <circle r="36" fill="#1E293B" stroke="#A855F7" stroke-width="2.5"/>
    <circle r="28" fill="#0F172A"/>
    <text y="-2" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="bold" fill="#E2E8F0" text-anchor="middle">Relay Swarm</text>
    <text y="13" font-family="monospace" font-size="9" fill="#C084FC" text-anchor="middle">Blind 2-Hop</text>
    <text y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Kademlia DHT (k=20)</text>
  </g>

  <!-- Animated Data Packet 2 (Onion / Store-and-Forward) -->
  <path d="M 150 150 Q 425 220 700 150" fill="none" stroke="url(#neonBlue)" stroke-width="2.5" stroke-dasharray="8 8">
    <animate attributeName="stroke-dashoffset" from="0" to="200" dur="3s" repeatCount="indefinite" />
  </path>
  <text x="425" y="210" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold" fill="#38BDF8" text-anchor="middle">
    🧅 2. Onion Routed &amp; Decentralized DHT Mailbox
  </text>

  <!-- Right Node (Recipient Bob) -->
  <g transform="translate(750, 130)">
    <circle r="42" fill="#1E293B" stroke="#10B981" stroke-width="3" filter="url(#glow)"/>
    <circle r="34" fill="#0F172A"/>
    <text y="-5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#F8FAFC" text-anchor="middle">Bob</text>
    <text y="14" font-family="monospace" font-size="10" fill="#94A3B8" text-anchor="middle">[Node 0x3C91]</text>
    <text y="58" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#4ADE80" text-anchor="middle">AEAD Decrypted</text>
  </g>
</svg>
