[package]
name = "nodex-messenger"
version = "0.1.0"
edition = "2021"

[dependencies]
nodex-kademlia = { path = "../nodex-kademlia" }
core-ffi = { path = "../core-ffi" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chacha20poly1305 = "0.10"
argon2 = "0.5"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
ed25519-dalek = "2.1"
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
