[package]
name = "nodex-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "nodex-cli"
path = "src/main.rs"

[dependencies]
nodex-kademlia = { path = "../nodex-kademlia" }
nodex-messenger = { path = "../nodex-messenger" }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
