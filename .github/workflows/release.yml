name: Build and Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Release Binary
        run: cargo build --release -p nodex-gui

      - name: Package Release Asset
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/release/nodex-gui.exe dist/NodeX.exe
          Compress-Archive -Path dist/NodeX.exe, LICENSE, readme.md -DestinationPath dist/NodeX-windows-x64.zip -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/NodeX.exe
            dist/NodeX-windows-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
