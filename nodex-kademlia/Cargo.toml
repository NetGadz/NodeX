[package]
name = "nodex-kademlia"
version = "0.1.0"
edition = "2021"

[dependencies]
core-ffi = { path = "../core-ffi" }
tokio = { version = "1", features = ["full"] }
rand = "0.8"
sha1 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crc32fast = "1.4"
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
sha2 = "0.10"
getrandom = "0.2"
